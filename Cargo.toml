[package]
name = "ai-document-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
serde = "1.0.228"
sqlx = { version = "0.8", features = [
  "runtime-tokio-native-tls",
  "postgres",
  "macros",
  "chrono",
  "uuid",
] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
dotenvy = "0.15.7"
config = "0.15.18"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = "0.3.20"
tracing-actix-web = "0.7.19"
argon2 = "0.5.3"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
actix-web-httpauth = "0.8.2"
serde_json = "1.0.145"
actix-cors = "0.7.1"
futures = "0.3.31"
derive_more = "2.0.1"
rand = "0.9.2"
base64 = "0.22.1"
actix-cookie = "0.1.0-alpha"
actix-multipart = "0.7.2"
tokio = { version = "1.48.0", features = ["fs"] }
sanitize-filename = "0.6.0"
futures-util = "0.3.31"
qdrant-client = { version = "1.15.0", features = ["serde"] }
fastembed = "5.2.0"
text-splitter = "0.28.0"
tokio-util = { version = "0.7.17", features = ["io", "codec"] }
bytes = "1.10.1"
pdf-extract = "0.10.0"
