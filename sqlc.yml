version: "2"
sql:
  - schema: "migrations/"
    queries: "internal/infrastructure/persistence/database/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/persistence/database/sqlc"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
